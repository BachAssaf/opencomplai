name: Publish to PyPI

# Publishes the four Opencomplai packages to PyPI when a version tag (vX.Y.Z) is
# pushed. Packages are built and uploaded in dependency order:
#   1. opencomplai-core   (no local deps)
#   2. opencomplai-cli    (depends on opencomplai-core)
#   3. opencomplai-ai     (depends on opencomplai-core)
#   4. opencomplai        (meta-package — depends on core + cli)
#
# Auth: **PyPI Trusted Publishing (OIDC)** — no API token, no long-lived secret.
# GitHub mints a short-lived OIDC token per upload and PyPI verifies it against
# a publisher it has been told to trust.
#
# Two attestations ship with every release:
#   * **PEP 740** attestations, generated by pypa/gh-action-pypi-publish when
#     publishing via Trusted Publishing, and shown by PyPI on the file page.
#   * **SLSA build provenance**, attached to the same distribution files via
#     actions/attest-build-provenance and verifiable with `gh attestation verify`.
#
# ONE-TIME HUMAN SETUP — this workflow cannot publish until it is done, and
# nothing in this repository can do it. For EACH of the four PyPI projects
# (opencomplai-core, opencomplai-cli, opencomplai-ai, opencomplai), add a
# trusted publisher under "Manage project → Publishing" with:
#     Owner:        <the GitHub org/user owning this repository>
#     Repository:   opencomplai
#     Workflow:     publish-pypi.yml
#     Environment:  pypi
# Until the trusted publishers exist, a tag push fails at the first upload
# with an OIDC error — it does not silently fall back to a token, which is
# the point.
#
# NOTE: the opencomplai-cli wheel force-includes
# packages/cli/src/opencomplai_cli/data/checker-local.html, a generated, git-ignored
# artifact produced by the checker-widget Node build. That build MUST run before the
# CLI package is built or its wheel will fail with "Forced include not found".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # Binds the OIDC token to a named environment, so the PyPI trusted-publisher
    # entry can be scoped to it and so environment protection rules gate releases.
    environment: pypi

    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing and Sigstore
      attestations: write # SLSA build provenance on the distribution files

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Generate the self-contained checker-local.html bundled into the CLI wheel.
      # build.mjs produces both docs/src/assets/js/checker-widget.js and the
      # data/checker-local.html that packages/cli/pyproject.toml force-includes.
      - name: Build checker widget (required by opencomplai-cli wheel)
        working-directory: docs/checker-widget
        run: |
          npm ci
          node build.mjs

      # Build everything before publishing anything. Provenance is then attested
      # over the whole set in one step, and a build failure in the meta-package
      # no longer leaves three of the four packages already released.
      - name: Build all distributions
        run: |
          uv build packages/core --out-dir packages/core/dist
          uv build packages/cli --out-dir packages/cli/dist
          uv build packages/ai --out-dir packages/ai/dist
          uv build packages/sdk-python --out-dir packages/sdk-python/dist

      - name: Attest SLSA build provenance for all distributions
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            packages/core/dist/*
            packages/cli/dist/*
            packages/ai/dist/*
            packages/sdk-python/dist/*

      # Upload order still matters: anyone resolving opencomplai-cli the moment
      # it appears must find opencomplai-core already there.
      # 1. core — no local dependencies
      - name: Publish opencomplai-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core/dist/
          attestations: true
          skip-existing: true

      # 2. cli — depends on opencomplai-core (publish core first)
      - name: Publish opencomplai-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cli/dist/
          attestations: true
          skip-existing: true

      # 3. ai — depends on opencomplai-core (independent of cli)
      - name: Publish opencomplai-ai
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/ai/dist/
          attestations: true
          skip-existing: true

      # 4. sdk meta-package — must be last (depends on core + cli)
      - name: Publish opencomplai (meta-package)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
          attestations: true
          skip-existing: true
